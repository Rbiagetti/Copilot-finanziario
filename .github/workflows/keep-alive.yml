name: Keep Backend Alive

on:
  schedule:
    - cron: "*/5 * * * *"  # ogni 10 minuti
  workflow_dispatch:         # trigger manuale dalla dashboard GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://copilot-finanziario.onrender.com/api/v1/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: backend returned $STATUS"
            exit 1
          fi
